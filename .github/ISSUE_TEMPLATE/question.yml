name: Usage question
description: Ask about installation, commands, compatibility, or an automation workflow.
title: "Question: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and read the
        [support guide](https://github.com/Hyperrick/spotpdf/blob/main/SUPPORT.md)
        first. Do not attach customer, production, confidential, or personal
        PDFs. Prefer a minimal synthetic reproducer or a clearly licensed
        public fixture. Redact sensitive paths, document names, spot names, and
        job identifiers from pasted commands or output.
  - type: input
    id: version
    attributes:
      label: spotpdf version
      description: Paste the exact output of `spotpdf --version`.
      placeholder: "spotpdf 0.7.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python, operating system, and architecture
      placeholder: "Python 3.13.7, macOS 15, arm64"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the print, prepress, or automation result you need.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and output
      description: Include the command, stdout, stderr, and exit code.
      render: shell
    validations:
      required: true
  - type: textarea
    id: inventory
    attributes:
      label: Relevant spotpdf list output
      render: text
  - type: dropdown
    id: protected
    attributes:
      label: PDF state
      options:
        - Unsigned, unencrypted, and unrestricted
        - Signed
        - Encrypted
        - Modification-restricted
        - Unknown
    validations:
      required: true
  - type: textarea
    id: research
    attributes:
      label: What have you already tried?
      description: Link relevant documentation or issues and describe the result.
  - type: textarea
    id: reproducer
    attributes:
      label: Synthetic or publicly licensed reproducer
      description: Provide generator code, or a canonical URL plus exact license.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data-safety confirmation
      options:
        - label: I have not attached a confidential PDF and have redacted sensitive output data.
          required: true
