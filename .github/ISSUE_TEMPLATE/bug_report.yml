name: Bug report
description: Report incorrect or unsafe spotpdf behavior with a synthetic reproducer.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach confidential customer or production PDFs. Generate a minimal
        synthetic reproducer or link to a clearly licensed public fixture.
        Security vulnerabilities must be reported privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: spotpdf version
      description: Paste the exact output of `spotpdf --version`.
      placeholder: "spotpdf 0.6.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python, operating system, and architecture
      placeholder: "Python 3.13.7, macOS 15, arm64"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and output
      description: Include the command, stdout, stderr, and exit code.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: inventory
    attributes:
      label: spotpdf list output
      render: text
    validations:
      required: true
  - type: dropdown
    id: protected
    attributes:
      label: PDF state
      options:
        - Unsigned, unencrypted, and unrestricted
        - Signed
        - Encrypted
        - Modification-restricted
        - Unknown
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Synthetic or publicly licensed reproducer
      description: Provide generator code, or a canonical URL plus exact license.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data-safety confirmation
      options:
        - label: I have not attached a customer, production, confidential, or personal PDF.
          required: true
