name: Feature request
description: Propose one clearly scoped spot-color workflow.
title: "Feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Spot renaming, alternate-preview editing, and process-color conversion have
        different print semantics. Please describe the exact operation you need.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What print or prepress task cannot be completed today?
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: Required PDF and print semantics
      description: State what should happen to the spot plate, preview, tint, overprint, and content streams.
    validations:
      required: true
  - type: textarea
    id: cli
    attributes:
      label: Proposed CLI
      render: shell
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: fixtures
    attributes:
      label: Synthetic or publicly licensed test cases
      description: Do not attach confidential or customer PDFs.
