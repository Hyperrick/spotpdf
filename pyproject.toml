[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spotpdf"
version = "0.3.0"
description = "Inspect, rename, and remove named spot colors in vector PDF content."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "spotpdf contributors" }]
keywords = ["pdf", "spot-color", "separation", "prepress", "printing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Printing",
]
dependencies = ["pikepdf>=10.12,<11"]

[project.urls]
Documentation = "https://github.com/Hyperrick/spotpdf#readme"
Changelog = "https://github.com/Hyperrick/spotpdf/blob/main/CHANGELOG.md"
Issues = "https://github.com/Hyperrick/spotpdf/issues"
Repository = "https://github.com/Hyperrick/spotpdf"

[project.scripts]
spotpdf = "spotpdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["ruff>=0.12,<1", "setuptools==84.0.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
